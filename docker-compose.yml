# Local development stack matching the architecture blueprint:
# - Django website & background worker handler
# - PostgreSQL 16 database
# - Mailpit local email inbox (view sent funeral invitations at http://localhost:8025)
# - Local Identity Platform auth emulator enabled via environment variables

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: virtualcemetery
      POSTGRES_USER: vc_app
      POSTGRES_PASSWORD: vc_local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vc_app -d virtualcemetery"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web inbox UI

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo_data &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      DJANGO_ENV: development
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: local-compose-dev-secret-key-not-for-prod
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DATABASE_URL: postgresql://vc_app:vc_local_dev_password@db:5432/virtualcemetery
      LOCAL_AUTH_EMULATOR: "True"
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SITE_BASE_URL: http://localhost:8000
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
