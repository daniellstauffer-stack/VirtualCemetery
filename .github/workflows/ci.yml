name: CI — Permissions, Publishing, Migrations & Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Django & Pytest Suite (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: virtualcemetery_test
          POSTGRES_USER: vc_test
          POSTGRES_PASSWORD: vc_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_ENV: development
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-test-only-secret-key
      DATABASE_URL: postgresql://vc_test:vc_test_password@localhost:5432/virtualcemetery_test
      LOCAL_AUTH_EMULATOR: "True"
      EMAIL_PROVIDER: console

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Django system checks and no missing migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Run migrations and seed demo data
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo_data

      - name: Run automated release-criteria test suite
        run: pytest -v

  docker-check:
    name: Verify Container Image Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production Docker image
        run: docker build -t virtual-cemetery:ci-check .
